<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 기술로 표적 기업을 찾아낸다 — 과녁. 16px(탭 크기)에서도 뭉개지지 않도록
       형태를 동심원 둘로만 두고 선을 굵게 잡았다. 색은 서비스 팔레트를 따른다
       (navy #1B2A4A / accent #2563EB). -->
  <rect width="32" height="32" rx="6" fill="#1B2A4A"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="2.4"/>
  <circle cx="16" cy="16" r="4" fill="#2563EB"/>
</svg>
